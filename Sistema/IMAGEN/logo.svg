<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="6" width="272" height="68" rx="20" fill="url(#logoBgGrad)" filter="url(#shadow)"/>
  
  <!-- Math Icon Badge -->
  <rect x="14" y="16" width="48" height="48" rx="14" fill="#FACC15" stroke="#FDE047" stroke-width="2"/>
  <text x="38" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#4338CA" text-anchor="middle">×</text>

  <!-- Text -->
  <text x="74" y="38" font-family="'Segoe UI', Roboto, Fredoka, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">MIS TABLAS</text>
  <text x="74" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" letter-spacing="1">AVENTURA 4° BÁSICO</text>

  <!-- Stars -->
  <polygon points="252,18 254,23 259,23 255,26 256,31 252,28 248,31 249,26 245,23 250,23" fill="url(#starGrad)"/>
  <polygon points="234,48 235,51 238,51 236,53 237,56 234,54 231,56 232,53 230,51 233,51" fill="url(#starGrad)"/>
</svg>
