<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="85%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
  <!-- Segments -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#64748B" stroke-width="8" stroke-dasharray="16 6"/>
  <!-- Middle Ring -->
  <circle cx="50" cy="50" r="26" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
  <!-- Glowing Core -->
  <circle cx="50" cy="50" r="18" fill="url(#arcGlow)"/>
  <!-- Triangle in core -->
  <polygon points="50,38 60,56 40,56" fill="none" stroke="#FFFFFF" stroke-width="2"/>
</svg>
