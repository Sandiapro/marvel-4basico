<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Background with Thunder Lightning -->
  <circle cx="60" cy="60" r="56" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
  <polygon points="56,12 50,34 60,34 52,54 70,30 60,30" fill="#FACC15"/>
  <!-- Winged Helmet -->
  <path d="M38 52 C38 32 82 32 82 52 L82 72 C82 82 70 86 60 86 C50 86 38 82 38 72 Z" fill="#94A3B8" stroke="#475569" stroke-width="2"/>
  <!-- Helmet Wings -->
  <polygon points="36,44 14,24 24,54" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="84,44 106,24 96,54" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <!-- Thor Face -->
  <ellipse cx="60" cy="64" rx="16" ry="14" fill="#FED7AA"/>
  <!-- Blue Eyes with Lightning -->
  <circle cx="53" cy="62" r="3.5" fill="#38BDF8"/>
  <circle cx="67" cy="62" r="3.5" fill="#38BDF8"/>
  <circle cx="53" cy="62" r="1.5" fill="#FFFFFF"/>
  <circle cx="67" cy="62" r="1.5" fill="#FFFFFF"/>
  <!-- Golden Hair locks -->
  <path d="M34 60 Q28 82 36 94" stroke="#FBBF24" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M86 60 Q92 82 84 94" stroke="#FBBF24" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Mjolnir Mini Badge -->
  <rect x="52" y="96" width="16" height="12" rx="2" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
  <rect x="58" y="108" width="4" height="8" rx="1" fill="#78350F"/>
</svg>
