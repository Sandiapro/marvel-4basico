<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gwenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="gwenHood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="gwenPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
  </defs>

  <!-- Background Circle (Dark Magenta / Navy) -->
  <circle cx="60" cy="60" r="56" fill="url(#gwenBg)" stroke="#F43F5E" stroke-width="4"/>

  <!-- Hood Outer (White) -->
  <path d="M22 68 Q22 20 60 16 Q98 20 98 68 Q98 106 60 108 Q22 106 22 68 Z" fill="url(#gwenHood)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Hood Inner Lining (Magenta Pink Web Lining) -->
  <path d="M30 66 Q30 28 60 26 Q90 28 90 66 Q90 98 60 100 Q30 98 30 66 Z" fill="url(#gwenPink)"/>

  <!-- Web Texture Inside Hood -->
  <line x1="60" y1="26" x2="60" y2="100" stroke="#881337" stroke-width="1.5" opacity="0.6"/>
  <line x1="30" y1="66" x2="90" y2="66" stroke="#881337" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="60" cy="66" rx="20" ry="24" fill="none" stroke="#881337" stroke-width="1.5" opacity="0.6"/>

  <!-- Mask Face (Pure White) -->
  <ellipse cx="60" cy="66" rx="26" ry="32" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>

  <!-- Ghost-Spider Teal / Cyan Eyes with Magenta Outer Rim -->
  <path d="M42 58 Q52 52 56 64 Q50 72 42 66 Z" fill="#22D3EE" stroke="#BE185D" stroke-width="3"/>
  <path d="M78 58 Q68 52 64 64 Q70 72 78 66 Z" fill="#22D3EE" stroke="#BE185D" stroke-width="3"/>
  <ellipse cx="49" cy="62" rx="3" ry="5" fill="#FFFFFF"/>
  <ellipse cx="71" cy="62" rx="3" ry="5" fill="#FFFFFF"/>

  <!-- Math Sparkle Star -->
  <circle cx="60" cy="18" r="7" fill="#FDE047"/>
  <text x="60" y="22" font-size="10" font-weight="900" fill="#78350F" text-anchor="middle">×</text>
</svg>
