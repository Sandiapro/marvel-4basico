<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="cmHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="cmSuitRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Cosmic Background -->
  <circle cx="60" cy="60" r="56" fill="url(#cmBg)" stroke="#FACC15" stroke-width="4"/>

  <!-- Blonde Hair Back Waves -->
  <path d="M26 48 Q22 78 34 94 Q48 104 60 102 Q72 104 86 94 Q98 78 94 48 Q88 18 60 18 Q32 18 26 48 Z" fill="url(#cmHair)" stroke="#CA8A04" stroke-width="2"/>

  <!-- Suit Chest & Collar -->
  <path d="M34 88 L60 98 L86 88 L92 114 L28 114 Z" fill="url(#cmSuitRed)" stroke="#FACC15" stroke-width="2"/>
  <polygon points="60,92 74,104 60,114 46,104" fill="#1D4ED8" stroke="#FACC15" stroke-width="1.5"/>

  <!-- Face Head -->
  <ellipse cx="60" cy="56" rx="24" ry="28" fill="#FED7AA" stroke="#FDBA74" stroke-width="2"/>

  <!-- Eyes and Cheerful Smile -->
  <ellipse cx="50" cy="54" rx="4" ry="5" fill="#1D4ED8"/>
  <ellipse cx="70" cy="54" rx="4" ry="5" fill="#1D4ED8"/>
  <circle cx="51" cy="53" r="1.5" fill="#FFFFFF"/>
  <circle cx="71" cy="53" r="1.5" fill="#FFFFFF"/>
  <path d="M54 68 Q60 74 66 68" fill="none" stroke="#9A3412" stroke-width="2" stroke-linecap="round"/>

  <!-- Blonde Hair Bangs -->
  <path d="M36 42 Q50 34 60 44 Q70 34 84 42 Q86 30 76 22 Q60 18 44 22 Q34 30 36 42 Z" fill="#FEF08A"/>

  <!-- 8-Point Golden Hala Star on Chest -->
  <polygon points="60,94 62,99 68,98 63,102 66,108 60,104 54,108 57,102 52,98 58,99" fill="#FDE047" stroke="#CA8A04" stroke-width="1"/>

  <!-- Binary Power Sparkle Badge -->
  <circle cx="60" cy="18" r="7" fill="#FACC15"/>
  <text x="60" y="22" font-size="10" font-weight="900" fill="#78350F" text-anchor="middle">⚡</text>
</svg>
